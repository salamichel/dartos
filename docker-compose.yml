services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dartos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dartos}
      POSTGRES_DB: ${POSTGRES_DB:-dartos}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dartos} -d ${POSTGRES_DB:-dartos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dartos}:${POSTGRES_PASSWORD:-dartos}@db:5432/${POSTGRES_DB:-dartos}?schema=public
      PORT: ${PORT:-3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-8030}:3000"
      - "5555:5555"
