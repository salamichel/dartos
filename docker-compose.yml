services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dartos
      POSTGRES_PASSWORD: dartos
      POSTGRES_DB: dartos
    ports:
      - "5432:5432"
    volumes:
      - dartos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dartos -d dartos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dartos:dartos@db:5432/dartos?schema=public
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  dartos_pg:
